[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopeek"
version = "0.1.0"
description = "nano-style terminal editor with live Markdown, JSON, YAML, TOML and Dockerfile previews"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "grobelr" }]
keywords = ["markdown", "editor", "nano", "tui", "terminal", "preview"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
]
dependencies = [
    "textual>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-markdown>=0.3",
    "tree-sitter-json>=0.21",
    "tree-sitter-yaml>=0.6",
    "tree-sitter-toml>=0.6",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/grobelr/nanopeek"

[project.scripts]
nanopeek = "nanopeek:main"

[tool.setuptools]
py-modules = ["nanopeek"]
