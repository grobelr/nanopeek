# Publishes to PyPI when a GitHub release is published, using Trusted
# Publishing (no API token): add a pending publisher on pypi.org for
# grobelr/nanopeek, workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Release tag matches the package version
        run: |
          version=$(sed -nE 's/^__version__ = "(.*)"/\1/p' nanopeek.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv build
      - run: uv publish
