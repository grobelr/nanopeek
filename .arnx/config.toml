consent_at = "2026-10-20T01:32:24+00:00"

[models]
reviewer = "anthropic:claude-sonnet-5-5"             # hunts the whole change, writes and runs the tests
hunter = "anthropic:claude-haiku-5-5"                # hunts each part of a big change
second_hunter = "openai:gpt-6.1-sol"                 # a hunter from another vendor
# second_hunter_effort = "low"                         # the second hunter's effort (unset: effort)
challenger = "river:zai-org/GLM-5.3-Flash"           # second opinion on each finding
challenger_fallback = "openai:gpt-6.1-sol"           # asked when the challenger fails or does not answer
answer_model = "anthropic:claude-haiku-5-5"          # turns your answers into tests
# JEV (experimental): set JEV_API_KEY in the environment, not here, for setup hints on unexplained failures
# openai_transport = "stream"                          # OpenAI calls stream (unset: polled in background)
effort = "medium"

[budget]
review_usd = 3.0
setup_usd = 3.0
answer_usd = 0.5

[review]
runs = 3
max_questions = 5
before_check = true                                  # rerun each failing test on the code before the change
accepted_tests_dir = "tests/arnx"
