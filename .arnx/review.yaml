version: 1
projects:
  nanopeek:
    root: .
    language: python
    runner: pytest
    image: python:3.12
    install:
      - pip install -e . pytest pytest-asyncio hypothesis
    test_command: python -m pytest -o "python_functions=main test_*" -o asyncio_mode=auto {targets}
    tests_dir: tests
    owns:
      - /nanopeek.py
      - /tests/
      - /pyproject.toml
      - /sample*
    uses: []
    notes:
      - Existing tests are scripts whose async main() is collected via python_functions=main with asyncio auto mode.
uncovered:
  - path: /docs/
    reason: documentation
  - path: /scripts/
    reason: screenshot helper script
